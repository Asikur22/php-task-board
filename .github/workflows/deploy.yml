name: Sync Files

on:
  push:
    branches: [ main ]

jobs:
  laravel-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v2

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          protocol: ftp
          exclude: |
            /database/*
            /uploads/*
            .env.example
            **/.git*
            **/.git*/**
